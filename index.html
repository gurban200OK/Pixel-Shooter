<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Top UI Bar (Initially Hidden) -->
        <div id="ui-bar" class="hidden">
            <div class="ui-element">Score: <span id="score">0</span></div>
            <div class="ui-element" id="level-ui">Level: <span id="level-display">1</span></div>
            <div class="ui-element">Health: <span id="health">100</span>%</div>
            <div class="ui-element" id="enemy-ui">Remaining Kills: <span id="enemy-count">0</span></div>
        </div>

        <!-- Game Screen -->
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h1>TOP-DOWN SHOOTER</h1>
            <!-- High Score Display on Main Menu -->
            <p class="high-score-display">All-Time High Score: <span id="start-high-score">0</span></p>

            <div class="mode-container">
                <p class="select-title">SELECT GAME MODE</p>
                <div class="mode-options">
                    <label class="mode-card">
                        <input type="radio" name="gameMode" value="levels" checked>
                        <div class="card-content">
                            <h3>LEVEL MODE</h3>
                            <p>4 Stages & Boss Fight</p>
                        </div>
                    </label>
                    <label class="mode-card">
                        <input type="radio" name="gameMode" value="endless">
                        <div class="card-content">
                            <h3>ENDLESS MODE</h3>
                            <p>Infinite Scaling & Bosses</p>
                        </div>
                    </label>
                </div>
            </div>
            <button id="start-btn">START GAME</button>
        </div>

        <!-- Game Over / Victory Screen Overlay (Initially Hidden) -->
        <div id="game-over-screen" class="overlay hidden">
            <h1 id="game-over-title" class="over-title">GAME OVER</h1>
            <p id="game-over-text">Your Final Score: <span id="final-score">0</span></p>
            <!-- High Score Display on Game Over -->
            <p class="high-score-display-over">Personal Best: <span id="over-high-score">0</span></p>
            
            <div class="button-group">
                <button id="restart-btn" class="btn-action">PLAY AGAIN</button>
                <button id="menu-btn" class="btn-action btn-secondary">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
